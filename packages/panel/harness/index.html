<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Parawatch panel harness</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--background-secondary);
        color: var(--text-normal);
        display: flex;
        gap: 16px;
        padding: 16px;
      }
      #panel {
        width: 340px;
        flex: none;
        background: var(--background-secondary);
        border: 1px solid var(--background-modifier-border);
        padding: 8px;
      }
      #log {
        font: 12px ui-monospace, Menlo, monospace;
        color: var(--text-muted);
      }
    </style>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="panel"></div>
    <div id="log"></div>
    <script>
      if (new URLSearchParams(location.search).get("theme") === "dark") document.documentElement.dataset.theme = "dark";
      // ?wide lets the panel take the page, to see the board beside the feed
      if (new URLSearchParams(location.search).has("wide")) document.getElementById("panel").style.cssText = "width:auto;flex:1;min-width:0";
    </script>
    <script src="harness.js"></script>
  </body>
</html>
