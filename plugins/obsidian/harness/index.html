<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Parawatch panel harness</title>
    <style>
      /* A rough stand-in for Obsidian's default theme variables. */
      :root {
        --background-primary: #ffffff;
        --background-secondary: #f6f6f6;
        --background-modifier-border: #e0e0e0;
        --background-modifier-hover: rgba(0, 0, 0, 0.05);
        --text-normal: #222222;
        --text-muted: #5c5c5c;
        --text-faint: #999999;
        --text-accent: #7046e0;
        --text-error: #d64545;
        --interactive-normal: #ffffff;
        --interactive-hover: #f0f0f0;
        --interactive-accent: #7852ee;
        --text-on-accent: #ffffff;
        --color-red: #e93147;
        --color-yellow: #c99500;
        --color-green: #08b94e;
        --color-cyan: #00a5b8;
        --font-ui-smaller: 12px;
        --font-ui-small: 13px;
        --font-ui-medium: 15px;
        --font-monospace: ui-monospace, Menlo, monospace;
        --font-semibold: 600;
        --font-normal: 400;
        --radius-s: 4px;
        --radius-m: 8px;
      }
      :root[data-theme="dark"] {
        --background-primary: #1e1e1e;
        --background-secondary: #262626;
        --background-modifier-border: #363636;
        --background-modifier-hover: rgba(255, 255, 255, 0.06);
        --text-normal: #dadada;
        --text-muted: #b3b3b3;
        --text-faint: #7a7a7a;
        --text-accent: #a68af9;
        --interactive-normal: #2a2a2a;
        --interactive-hover: #303030;
        --color-yellow: #e0de71;
        --color-cyan: #53dfdd;
        --color-red: #fb464c;
        --color-green: #44cf6e;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--background-secondary);
        color: var(--text-normal);
        display: flex;
        gap: 16px;
        padding: 16px;
      }
      #panel {
        width: 340px;
        flex: none;
        background: var(--background-secondary);
        border: 1px solid var(--background-modifier-border);
        padding: 8px;
      }
      #log {
        font: 12px ui-monospace, Menlo, monospace;
        color: var(--text-muted);
      }
      button {
        font: inherit;
        font-size: 13px;
        color: var(--text-normal);
        background: var(--interactive-normal);
        border: 1px solid var(--background-modifier-border);
        border-radius: 4px;
        padding: 4px 10px;
        cursor: pointer;
      }
      button:hover {
        background: var(--interactive-hover);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button.mod-cta {
        background: var(--interactive-accent);
        color: var(--text-on-accent);
        border-color: transparent;
      }
      button.clickable-icon {
        border: none;
        background: transparent;
        padding: 2px 6px;
      }
      textarea {
        font: inherit;
        color: var(--text-normal);
        background: var(--background-primary);
        border: 1px solid var(--background-modifier-border);
        border-radius: 4px;
        padding: 6px 8px;
        box-sizing: border-box;
      }
    </style>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="panel"></div>
    <div id="log"></div>
    <script>
      if (new URLSearchParams(location.search).get("theme") === "dark") document.documentElement.dataset.theme = "dark";
    </script>
    <script src="harness.js"></script>
  </body>
</html>
