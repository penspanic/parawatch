name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # the tests do not start Electron, so skip its 100 MB download
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vitest run
        working-directory: apps/desktop
      - run: npm run build

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.5"
      - run: terraform fmt -check -recursive infra/terraform
      # no credentials and no backend: checks the code only, never the real infrastructure
      - run: terraform -chdir=infra/terraform/envs/prod init -backend=false -input=false
      - run: terraform -chdir=infra/terraform/envs/prod validate
      - run: terraform -chdir=infra/terraform/envs/ci init -backend=false -input=false
      - run: terraform -chdir=infra/terraform/envs/ci validate
      - name: The deploy workflow and the relay setup script parse
        run: |
          bash -n deploy/relay/setup.sh
          python3 -c "import sys, yaml; [yaml.safe_load(open(f)) for f in sys.argv[1:]]" .github/workflows/*.yml
